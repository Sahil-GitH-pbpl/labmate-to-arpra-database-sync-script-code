[[rules]]
id = "database-connection-url"
description = "Database connection URL"
regex = '''(?i)\b((?:mysql|postgresql|postgres|mongodb(?:\+srv)?|redis|rediss|mssql|sqlserver)://[^\s"']+)'''
secretGroup = 1

[[rules]]
id = "committed-env-file"
description = "Tracked environment file content (safe templates checked by credential rules)"
path = '''(^|/)\.env(?:\.[^/]*)?$'''
regex = '''(?m)^.{1,}'''

[[rules.allowlists]]
paths = ['''(?i)(^|/)(?:\.env(?:\.[^/]*)?\.(?:example|sample|template)|\.env\.(?:example|sample|template)|env\.(?:example|sample|template))$''']

[[rules]]
id = "private-key-header"
description = "Private key detected"
regex = '''(-----BEGIN (?:RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----)'''
secretGroup = 1
